<text x="186.5" y="116" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333">&#171;table&#187;</text>
<text x="186.5" y="129" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">users</text>
<line x1="30" y1="137" x2="343.0" y2="137" stroke="#2e7d32"/>
<text x="38" y="151" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">PK  id: text</text>
<text x="38" y="165" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">UQ  username: text   (3-30 chars, lower case)</text>
<text x="38" y="179" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    password_hash: text</text>
<text x="38" y="193" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    role: text   (&#x27;customer&#x27; | &#x27;admin&#x27;)</text>
<text x="38" y="207" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    created_at: timestamptz</text>
<line x1="30" y1="215" x2="343.0" y2="215" stroke="#2e7d32"/>
<rect x="620" y="100" width="365.79999999999995" height="179" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="802.9" y="116" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333">&#171;table&#187;</text>
<text x="802.9" y="129" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">analyses</text>
<line x1="620" y1="137" x2="985.8" y2="137" stroke="#2e7d32"/>
<text x="628" y="151" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">PK  id: text</text>
<text x="628" y="165" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">FK  owner_id -&gt; users.id</text>
<text x="628" y="179" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    status: text   (&#x27;processing&#x27; | &#x27;done&#x27; | &#x27;failed&#x27;)</text>
<text x="628" y="193" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    filename: text</text>
<text x="628" y="207" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    context: text</text>
<text x="628" y="221" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    contract_text: text</text>
<text x="628" y="235" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    contract_hash: text   (SHA-256 of text + context)</text>
<text x="628" y="249" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    created_at: timestamptz</text>
<text x="628" y="263" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">IX  (owner_id, contract_hash)</text>
<line x1="620" y1="271" x2="985.8" y2="271" stroke="#2e7d32"/>
<rect x="620" y="470" width="346.0" height="221" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="793.0" y="486" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333">&#171;table&#187;</text>
<text x="793.0" y="499" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">clauses</text>
<line x1="620" y1="507" x2="966.0" y2="507" stroke="#2e7d32"/>
<text x="628" y="521" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">PK  id: serial</text>
<text x="628" y="535" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">FK  analysis_id -&gt; analyses.id  ON DELETE CASCADE</text>
<text x="628" y="549" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    position: int  (&gt;= 1)</text>
<text x="628" y="563" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    clause_type: text</text>
<text x="628" y="577" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    risk_level: text   (&#x27;HIGH&#x27; | &#x27;MEDIUM&#x27; | &#x27;LOW&#x27;)</text>
<text x="628" y="591" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    clause_text: text</text>
<text x="628" y="605" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    location_page: int</text>
<text x="628" y="619" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    location_clause_ref: text</text>
<text x="628" y="633" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    location_raw: text</text>
<text x="628" y="647" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    issue_description: text</text>
<text x="628" y="661" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    workaround: text</text>
<text x="628" y="675" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">UQ  (analysis_id, position)</text>
<line x1="620" y1="683" x2="966.0" y2="683" stroke="#2e7d32"/>
<rect x="30" y="620" width="471.4" height="137" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="265.7" y="636" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333">&#171;table&#187;</text>
<text x="265.7" y="649" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">clause_comments</text>
<line x1="30" y1="657" x2="501.4" y2="657" stroke="#2e7d32"/>
<text x="38" y="671" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">PK  id: text</text>
<text x="38" y="685" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">FK  clause_id -&gt; clauses.id  ON DELETE CASCADE   (UQ: one per clause)</text>
<text x="38" y="699" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">FK  author_id -&gt; users.id</text>
<text x="38" y="713" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    text: text   (1-2000 chars)</text>
<text x="38" y="727" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    created_at: timestamptz</text>
<text x="38" y="741" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    updated_at: timestamptz</text>
<line x1="30" y1="749" x2="501.4" y2="749" stroke="#2e7d32"/>
<rect x="1220" y="470" width="346.0" height="109" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="1393.0" y="486" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333">&#171;table&#187;</text>
<text x="1393.0" y="499" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">clause_references</text>
<line x1="1220" y1="507" x2="1566.0" y2="507" stroke="#2e7d32"/>
<text x="1228" y="521" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">PK, FK  clause_id -&gt; clauses.id  ON DELETE CASCADE</text>
<text x="1228" y="535" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">PK, FK  reference_id -&gt; legal_references.id</text>
<text x="1228" y="549" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    position: int  (&gt;= 1)</text>
<text x="1228" y="563" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    snippet: text</text>
<line x1="1220" y1="571" x2="1566.0" y2="571" stroke="#2e7d32"/>
<rect x="1220" y="750" width="464.79999999999995" height="123" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="1452.4" y="766" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333">&#171;table&#187;</text>
<text x="1452.4" y="779" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">legal_references</text>
<line x1="1220" y1="787" x2="1684.8" y2="787" stroke="#2e7d32"/>
<text x="1228" y="801" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">PK  id: text   (hash of the URL, so a source is stored once)</text>
<text x="1228" y="815" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">UQ  url: text</text>
<text x="1228" y="829" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    title: text</text>
<text x="1228" y="843" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    domain: text</text>
<text x="1228" y="857" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#222">    verification: text   (&#x27;unverified&#x27; | &#x27;verified_sg&#x27; | &#x27;rejected&#x27;)</text>
<line x1="1220" y1="865" x2="1684.8" y2="865" stroke="#2e7d32"/>
<rect x="620" y="880" width="560" height="57" fill="#fffde7" stroke="#9e9d24" stroke-dasharray="4 3"/>
<text x="630" y="900" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#333">Sequences: users_id_seq, analyses_id_seq, comments_id_seq give the numbers behind us_001, an_001, cm_001.</text>
<text x="630" y="915" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#333">Check constraints keep role, status, risk_level and verification to the allowed values.</text>
<text x="630" y="930" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#333">Legal references are shared between analyses, so they are not deleted with an analysis.</text>
</svg>