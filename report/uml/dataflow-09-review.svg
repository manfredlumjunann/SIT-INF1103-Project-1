<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930">
<defs><marker id="tri" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#fff" stroke="#222" stroke-width="1.3"/></marker><marker id="dia" markerWidth="20" markerHeight="14" refX="1" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,7 L9,1 L17,7 L9,13 Z" fill="#222" stroke="#222" stroke-width="1"/></marker><marker id="diaw" markerWidth="20" markerHeight="14" refX="1" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,7 L9,1 L17,7 L9,13 Z" fill="#fff" stroke="#222" stroke-width="1.3"/></marker><marker id="arr" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#222" stroke-width="1.3"/></marker><marker id="arrf" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#222" stroke="#222" stroke-width="1"/></marker></defs>
<rect width="1500" height="930" fill="#ffffff"/>
<text x="24" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111">Data flow: administrator review</text>
<text x="24" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#555">Boss logs in, comments on a clause; the customer reads it</text>
<rect x="35.0" y="70" width="150" height="30" rx="3" fill="#f5f5f5" stroke="#616161" stroke-width="1.5"/>
<text x="110.0" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">Boss (browser)</text>
<rect x="250.0" y="70" width="160" height="30" rx="3" fill="#f5f5f5" stroke="#616161" stroke-width="1.5"/>
<text x="330.0" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">Customer (browser)</text>
<rect x="505.0" y="70" width="130" height="30" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
<text x="570.0" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">IOManager</text>
<rect x="710.0" y="70" width="120" height="30" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="770.0" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">AuthService</text>
<rect x="915.0" y="70" width="130" height="30" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="980.0" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">ReviewService</text>
<rect x="1125.0" y="70" width="130" height="30" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="1190.0" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">DataManager</text>
<rect x="1320.0" y="70" width="120" height="30" rx="3" fill="#f5f5f5" stroke="#616161" stroke-width="1.5"/>
<text x="1380.0" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111">PostgreSQL</text>
<line x1="110" y1="100" x2="110" y2="900" stroke="#999" stroke-dasharray="5 5"/>
<line x1="330" y1="100" x2="330" y2="900" stroke="#999" stroke-dasharray="5 5"/>
<line x1="570" y1="100" x2="570" y2="900" stroke="#999" stroke-dasharray="5 5"/>
<line x1="770" y1="100" x2="770" y2="900" stroke="#999" stroke-dasharray="5 5"/>
<line x1="980" y1="100" x2="980" y2="900" stroke="#999" stroke-dasharray="5 5"/>
<line x1="1190" y1="100" x2="1190" y2="900" stroke="#999" stroke-dasharray="5 5"/>
<line x1="1380" y1="100" x2="1380" y2="900" stroke="#999" stroke-dasharray="5 5"/>
<line x1="110" y1="140" x2="570" y2="140" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="340.0" y="133" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">1. POST /api/auth/login</text>
<line x1="570" y1="180" x2="770" y2="180" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="670.0" y="173" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">2. authenticate(username, password)</text>
<line x1="770" y1="220" x2="1190" y2="220" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="980.0" y="213" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">3. users.find_by_username()</text>
<line x1="570" y1="260" x2="110" y2="260" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="340.0" y="253" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">4. user with role &quot;admin&quot;: page goes to admin.html</text>
<line x1="110" y1="300" x2="570" y2="300" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="340.0" y="293" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">5. GET /api/admin/users and /api/admin/analyses  (_admin_required)</text>
<line x1="570" y1="340" x2="1190" y2="340" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="880.0" y="333" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">6. users.list(), analyses.list()</text>
<line x1="570" y1="380" x2="110" y2="380" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="340.0" y="373" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">7. every user with their files and &quot;n/m commented&quot;; users expand / collapse</text>
<line x1="110" y1="420" x2="570" y2="420" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="340.0" y="413" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">8. GET /api/analyses/&lt;id&gt;  (an admin may open any analysis)</text>
<line x1="570" y1="460" x2="110" y2="460" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="340.0" y="453" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">9. flagged clauses with any existing comment</text>
<line x1="110" y1="500" x2="570" y2="500" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="340.0" y="493" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">10. PUT .../clauses/&lt;n&gt;/comment {text}  (_admin_required)</text>
<line x1="570" y1="540" x2="980" y2="540" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="775.0" y="533" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">11. comment_on_clause(reviewer, id, n, text)</text>
<rect x="976" y="566" width="8" height="28" fill="#fff" stroke="#222"/>
<text x="994" y="584" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-style="italic" fill="#222">12. checks: reviewer is admin, analysis exists and is done</text>
<line x1="980" y1="620" x2="1190" y2="620" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="1085.0" y="613" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">13. comments.save(): add, or replace the clause&#x27;s comment</text>
<line x1="1190" y1="660" x2="1380" y2="660" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="1285.0" y="653" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">14. INSERT or UPDATE clause_comments</text>
<line x1="570" y1="700" x2="110" y2="700" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="340.0" y="693" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">15. the saved comment (ReviewError becomes 400 / 403 / 404 / 409)</text>
<line x1="330" y1="740" x2="570" y2="740" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="450.0" y="733" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">16. GET /api/analyses/&lt;id&gt;  (their own analysis)</text>
<line x1="570" y1="780" x2="330" y2="780" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="450.0" y="773" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">17. clauses with the comment shown read-only</text>
<line x1="330" y1="820" x2="570" y2="820" stroke="#222" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="450.0" y="813" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">18. PUT or DELETE a comment</text>
<line x1="570" y1="860" x2="330" y2="860" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="450.0" y="853" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">19. 403: administrators only</text>
</svg>