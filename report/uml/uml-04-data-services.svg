<text x="40" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#333">Repository&lt;T&gt; is the abstract parent.</text>
<text x="40" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#333">Each subclass stores one entity:</text>
<text x="40" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#333">User, LegalReference, Analysis, ClauseComment.</text>
<text x="40" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#333">All of them return entity objects, not dicts.</text>
