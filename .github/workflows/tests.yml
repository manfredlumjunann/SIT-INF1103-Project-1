name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the automated tests in Docker (no live AI, throwaway PostgreSQL)
        run: docker compose -f docker-compose.test.yml -p inf1103-tests run --rm tests
      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.test.yml -p inf1103-tests down -v
