# Runs the automated tests in Docker against a throwaway PostgreSQL database.
#   docker compose -f docker-compose.test.yml -p inf1103-tests run --rm tests
#   docker compose -f docker-compose.test.yml -p inf1103-tests down -v
# (-p keeps this stack separate from the app's own containers)
services:
  test-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  tests:
    build: .
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@test-db:5432/postgres
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore::ResourceWarning"
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["python"]
    command: ["tests/run_report.py"]
