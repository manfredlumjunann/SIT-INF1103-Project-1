<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Clause Analyzer</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-pending">
    <div class="app" id="app">
        <!-- Sidebar: every user, signed-in admin -->
        <aside class="sidebar" id="sidebar" aria-label="Users">
            <div class="sidebar-top">
                <div class="brand">
                    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M6 3h8l4 4v14H6z" fill="currentColor" opacity="0.25"/>
                        <path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
                    </svg>
                    <span>Clause Analyzer</span>
                    <span class="role-tag">Admin</span>
                </div>
                <button type="button" id="sidebar-close" class="icon-btn sidebar-close" aria-label="Close sidebar">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-heading">
                    <span>Users</span>
                </div>
                <p id="user-message" class="history-message" hidden></p>
                <ul id="user-list" class="history-list"></ul>
            </div>

            <div class="sidebar-footer">
                <div class="user-chip">
                    <span id="user-avatar" class="avatar" aria-hidden="true"></span>
                    <span id="user-name" class="user-name"></span>
                </div>
                <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch light or dark theme" title="Switch theme">
                    <svg class="icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
                <button type="button" id="logout-btn" class="icon-btn" aria-label="Sign out" title="Sign out">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                </button>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <main class="main">
            <header class="topbar">
                <button type="button" id="sidebar-open" class="icon-btn" aria-label="Open sidebar">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <span class="brand">Clause Analyzer</span>
            </header>

            <div class="content" id="content">
                <!-- Analyses of the selected user (or of everyone) -->
                <section class="admin-panel" id="list-view">
                    <h1 class="admin-title" id="list-title">All users</h1>
                    <p class="result-meta" id="list-subtitle"></p>
                    <p id="page-error" class="field-error" role="alert" hidden></p>
                    <p id="list-message" class="notice" hidden></p>
                    <ul id="analysis-list" class="analysis-list"></ul>
                </section>

                <!-- One analysis, or a comparison of two (read-only) -->
                <section class="admin-panel" id="detail-view" hidden>
                    <button type="button" id="back-btn" class="btn-ghost">← Back to analyses</button>
                    <div class="admin-thread" id="thread" aria-live="polite"></div>
                </section>

                <div class="compare-tray" id="compare-tray" hidden>
                    <div class="compare-slots" id="compare-slots"></div>
                    <div class="compare-bar-actions">
                        <button type="button" id="compare-run" class="btn-primary" disabled>Compare</button>
                        <button type="button" id="compare-clear" class="btn-ghost">Clear</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="common.js"></script>
    <script src="admin.js"></script>
</body>
</html>
