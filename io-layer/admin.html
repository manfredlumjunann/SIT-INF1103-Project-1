<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review submissions - Clause Analyzer</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-pending admin-body">
    <div class="admin-page" id="admin-page">
        <header class="admin-header">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M6 3h8l4 4v14H6z" fill="currentColor" opacity="0.25"/>
                    <path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
                <span>Clause Analyzer · Review</span>
            </div>
            <div class="admin-header-actions">
                <span id="user-name" class="user-name"></span>
                <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch light or dark theme" title="Switch theme">
                    <svg class="icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
                <button type="button" id="logout-btn" class="icon-btn" aria-label="Sign out" title="Sign out">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                </button>
            </div>
        </header>

        <main class="admin-main">
            <!-- Everyone's submitted files, grouped by user -->
            <section id="users-view" aria-labelledby="users-title">
                <h1 id="users-title" class="admin-title">Submitted files</h1>
                <p class="admin-sub">Open a user to see the files they submitted, then open a file to comment on its flagged clauses.</p>
                <p id="users-message" class="notice" hidden></p>
                <div id="users-list" class="user-groups"></div>
            </section>

            <!-- One file with a comment box under every flagged clause -->
            <section id="review-view" aria-live="polite" hidden>
                <button type="button" id="back-btn" class="btn-ghost">← Back to all files</button>
                <div id="review-content"></div>
            </section>
        </main>
    </div>

    <script src="common.js"></script>
    <script src="admin.js"></script>
</body>
</html>
