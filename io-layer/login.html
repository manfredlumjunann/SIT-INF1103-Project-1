<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clause Analyzer</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="auth-header">
        <div class="brand">
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 3h8l4 4v14H6z" fill="currentColor" opacity="0.25"/>
                <path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
            <span>Clause Analyzer</span>
        </div>
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch light or dark theme" title="Switch theme">
            <svg class="icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
    </header>

    <main class="auth-main">
        <div class="auth-box">
            <h1 id="auth-title">Login</h1>
            <p id="auth-subtitle" class="auth-subtitle">Hi, welcome back 👋</p>

            <form id="auth-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="text-input" placeholder="E.g. johndoe"
                           autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required>
                    <p class="field-hint register-only" hidden>3-30 characters: letters, numbers, . _ or -</p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" class="text-input"
                               placeholder="Enter your password" autocomplete="current-password" maxlength="128" required>
                        <button type="button" id="password-toggle" class="icon-btn password-toggle"
                                aria-label="Show password" aria-pressed="false">
                            <svg class="icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.6 3.5M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                        </button>
                    </div>
                    <p class="field-hint register-only" hidden>At least 8 characters.</p>
                </div>

                <div class="form-group register-only" hidden>
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" class="text-input"
                           placeholder="Re-enter your password" autocomplete="new-password" maxlength="128">
                </div>

                <p id="auth-error" class="field-error" role="alert" hidden></p>

                <button type="submit" id="auth-submit" class="btn-primary">Login</button>
            </form>

            <p class="auth-switch">
                <span id="switch-text">Not registered yet?</span>
                <button type="button" id="switch-mode" class="link-btn">Create an account ↗</button>
            </p>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
